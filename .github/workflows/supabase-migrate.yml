# Applies new files in supabase/migrations to the live Supabase project
# whenever they land on main -- no manual SQL Editor runs.
#
# One-time setup (GitHub repo -> Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   the project's database password
#   SUPABASE_PROJECT_ID    the project ref (the xxxx in https://xxxx.supabase.co)
#
# SAFETY: migrations 0001-0011 are legacy files that were applied by hand and
# several of them DROP TABLEs / DELETE seed data (0004, 0008). They must never
# run against the live database again, so every run first marks them as already
# applied, then does a dry run and aborts if the CLI still wants to run any of
# them. Only migrations numbered 0012 and up are ever pushed.
name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migrate.yml"
  workflow_dispatch:

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are configured
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::warning title=Supabase migrations NOT applied::Add SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_ID as repository secrets (see supabase/README.md), then re-run this workflow."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.configured == 'true'
        with:
          version: latest

      - name: Link project
        if: steps.secrets.outputs.configured == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Mark legacy migrations 0001-0011 as already applied
        if: steps.secrets.outputs.configured == 'true'
        run: supabase migration repair --status applied $(printf '%04d ' $(seq 1 11))

      - name: Dry run (and refuse to touch legacy migrations)
        if: steps.secrets.outputs.configured == 'true'
        run: |
          supabase db push --dry-run | tee dry-run.txt
          if grep -Eq '(000[1-9]|0010|0011)_[A-Za-z]' dry-run.txt; then
            echo "::error title=Refusing to push::The CLI wants to run a legacy migration (0001-0011), which would drop/overwrite live data. Aborting."
            exit 1
          fi

      - name: Apply pending migrations
        if: steps.secrets.outputs.configured == 'true'
        run: supabase db push
